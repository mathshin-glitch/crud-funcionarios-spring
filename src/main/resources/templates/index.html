<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Gerenciamento de Funcionários</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>

<body>

<div class="container my-2">

    <h1>Lista de Funcionários</h1>

    <!-- Botão para cadastrar um novo funcionário -->
    <a th:href="@{/criarFuncionarioForm}"
       class="btn btn-primary btn-sm mb-3">
        Adicionar
    </a>

    <table border="1"
           class="table table-striped table-responsive-md">

        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Salário</th>
                <th>Operações</th>
            </tr>
        </thead>

        <tbody>

            <!-- Percorre a lista de funcionários -->
            <tr th:each="func : ${listarFuncionarios}">

                <td th:text="${func.id}"></td>

                <td th:text="${func.nome}"></td>

                <td th:text="${func.cpf}"></td>

                <td th:text="${func.email}"></td>

                <td th:text="${func.telefone}"></td>

                <td th:text="${func.salario}"></td>

                <td>

                    <!-- Atualizar -->
                    <a th:href="@{/atualizarFuncionarioForm/{id}(id=${func.id})}"
                       class="btn btn-primary">
                        Atualizar
                    </a>

                    <!-- Excluir -->
                    <a th:href="@{/deletarFuncionario/{id}(id=${func.id})}"
                       class="btn btn-danger">
                        Excluir
                    </a>

                </td>

            </tr>

        </tbody>

    </table>

</div>

</body>

</html>
