<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">

        <title>Gerenciamento de Funcionários</title>

        <link rel="stylesheet"
              href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    </head>

    <body>

        <div class="container">

            <h1>Gerenciamento de Funcionários</h1>

            <hr>

            <h2>Adicionar</h2>

            <form th:action="@{/salvarFuncionario}"
                  th:object="${funcionario}"
                  method="POST">

                <!-- Nome -->
                <input type="text"
                       th:field="*{nome}"
                       placeholder="Insira o nome"
                       class="form-control mt-4 col-4">

                <span class="text-danger"
                      th:if="${#fields.hasErrors('nome')}"
                      th:errors="*{nome}">
                </span>


                <!-- CPF -->
                <input type="text"
                       th:field="*{cpf}"
                       placeholder="Insira o CPF"
                       class="form-control mt-4 col-4">

                <span class="text-danger"
                      th:if="${#fields.hasErrors('cpf')}"
                      th:errors="*{cpf}">
                </span>


                <!-- E-mail -->
                <input type="text"
                       th:field="*{email}"
                       placeholder="Insira o Email"
                       class="form-control mt-4 col-4">

                <span class="text-danger"
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}">
                </span>


                <!-- Telefone -->
                <input type="text"
                       th:field="*{telefone}"
                       placeholder="Insira o Telefone"
                       class="form-control mt-4 col-4">

                <span class="text-danger"
                      th:if="${#fields.hasErrors('telefone')}"
                      th:errors="*{telefone}">
                </span>


                <!-- Salário -->
                <input type="number"
                       th:field="*{salario}"
                       placeholder="Insira o Salário"
                       class="form-control mt-4 col-4">

                <span class="text-danger"
                      th:if="${#fields.hasErrors('salario')}"
                      th:errors="*{salario}">
                </span>


                <button type="submit"
                        class="btn btn-info mt-4">
                    Salvar
                </button>

            </form>

            <hr>

            <a th:href="@{/}">
                Retornar
            </a>

        </div>

    </body>

</html>
